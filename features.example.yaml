# 기능 목록 예시 — 복사: mkdir -p features && cp features.example.yaml features/내프로젝트.yaml
# git_projects.yaml 의 template: features 항목이 읽는다. (가이드 §3 "큰 기능 단위 방식")
#
# 이 파일이 이력서 "담당 업무 · 사용 기술 · 얻은 것" 의 원본이다.
#   - 커밋 제목은 이력서에 그대로 실리지 않는다. 커밋은 "이 기능에 내 작업이 있는가" 를 세는 데만 쓴다.
#   - 내 커밋이 한 건도 없는 기능은 이력서에서 빠진다.
#   - 어느 기능에도 안 걸린 커밋은 실행 로그에 "미분류" 로만 나온다 → 새 큰 기능이면 여기에 더한다.
#
# match 는 이 순서로 본다 (같은 순위 안에서는 이 파일에 적힌 기능 순서):
#   1) scopes          커밋 제목 type(scope) 의 scope 가 같다        예: feat(chat): ... → chat
#   2) types           scope 로 못 가른 커밋의 type 이 같다          예: ci: ... → ci
#   3) subject         제목에 정규식이 걸린다 (대소문자 무시)
#   4) fallback_scopes 위 셋으로 못 가른 커밋의 scope
#   5) repos           그래도 못 가른 그 저장소의 커밋 전부 (저장소 이름은 git_projects.yaml 의 name)

features:
  - id: search
    title: 통합 검색 기능
    points:
      - 형태소 분석 기반 검색 API 와 자동완성
      - 검색 색인 배치와 재색인 무중단 전환
    match:
      scopes: [search]
      subject: ['검색', '색인']

  - id: cicd
    title: CI/CD · 배포 자동화
    points:
      - GitHub Actions 자동 배포와 실패 시 롤백
    match:
      scopes: [ci, deploy]
      types: [ci, build]
      subject: ['배포', 'workflow']

# 미분류 보고에서 뺄 커밋 (기능이 아닌 잡일)
ignore:
  types: [docs, chore, test, revert, style]
  subject: ['^commit$', '^Revert ']

# 사용 기술 및 솔루션 — {java} {spring_boot} {spark} 는 첫 저장소의 build.gradle, {tag} 는 최신 릴리스 tag.
# {tag} 가 든 줄은 tag 가 없으면 빠진다. build.gradle 이 없는 프로젝트는 자리 표시 없이 그대로 적는다.
stack:
  - '언어: Java {java}, TypeScript'
  - '프레임워크: Spring Boot {spring_boot}, React'
  - '릴리스: {tag}'

# 프로젝트를 통해 얻은 것 — 항목마다 Notion callout 하나
learnings:
  - title: 배운 점 제목
    body: 무엇을 하면서 무엇을 배웠는지 한두 문장.
