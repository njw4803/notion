# SyncBox 경력 — 큰 기능 단위 목록
# git_projects.yaml 의 template: features 항목이 읽는다 (update_from_git.py).
#
# 이 파일이 이력서 "담당 업무 · 사용 기술 · 얻은 것" 의 원본이다.
#   - 글을 고치려면 여기서 고친다. MD 의 해당 구역은 실행할 때마다 이 파일로 다시 쓴다.
#   - 커밋 제목은 이력서에 그대로 실리지 않는다. 커밋은 "이 기능에 내 작업이 있는가" 를 세는 데만 쓴다.
#   - 내 커밋이 한 건도 없는 기능은 이력서에서 빠진다.
#   - 어느 기능에도 안 걸린 커밋은 실행 로그에 "미분류" 로만 나온다 → 새 큰 기능이 생겼다는 신호. 그때 기능을 더한다.
#
# match 는 위에서부터 이 순서로 본다 (같은 순위 안에서는 이 파일에 적힌 기능 순서):
#   1) scopes          커밋 제목 type(scope) 의 scope 가 같다        예: feat(chat): ... → chat
#   2) types           scope 로 못 가른 커밋의 type 이 같다          예: ci: ... → ci
#   3) subject         제목에 정규식이 걸린다 (대소문자 무시)
#   4) fallback_scopes 위 셋으로 못 가른 커밋의 scope
#   5) repos           그래도 못 가른 그 저장소의 커밋 전부 (저장소 이름은 git_projects.yaml 의 name)

features:
  - id: ai-assistant
    title: AI 어시스턴트 — 사내 구축 LLM(Gemma) 연동 대화형 데이터 전처리
    points:
      - 자연어 요청을 전처리 Step 20여 종(행 제거·계산 컬럼·집계·조인·피벗 등)으로 제안하고 승인 카드로 적용
      - SQL 을 붙이면 데이터셋과 Step 으로 변환(WITH·서브쿼리·윈도 함수, 7개 DB 방언)하고 같은 결과 SQL 추천
      - 요청 분류 → 기능별 프롬프트·스키마의 2단 호출 구조 설계, 실제 모델 평가 세트로 회귀 검증
      - 사용법 안내, 참고 문서 기반 답변, 인사이트 요약, FLOW 결과 검사와 실패 원인 설명
    match:
      scopes: [chat, chatbot, chat-sql]
      subject: ['LLM', '챗봇', '어시스턴트', 'AI 전처리', '번역 ?(key|키)', '결과 검사', 'llama', 'Ollama']

  - id: user-function-python
    title: 사용자 정의 함수 · 파이썬 실행 환경
    points:
      - 수식 사용자 정의 함수 — 생성·버전 고정·공유, Step 과 리포트 계산 필드에서 사용, 말로 요청하면 AI 가 작성
      - 파이썬 실행 사이드카(FastAPI) — 격리된 프로세스에서 사용자 코드 실행, Spark DataFrame 을 Apache Arrow 로 전달
      - 파이썬 변환 Step·수식 안 파이썬 함수, scipy·statsmodels·scikit-learn 분석, Spark MLlib 군집 Step
    match:
      scopes: [pyrunner, python, cluster]
      subject: ['사용자 정의', '사용자 함수', '내 함수', '파이썬', '사이드카', 'NetCDF', '\.nc\b', '군집', 'MLlib']

  - id: monitoring
    title: 시스템 모니터링 구축
    points:
      - Prometheus·Alertmanager·exporter 스택(Docker Compose) — 알림 규칙 40여 개와 규칙 테스트, 메신저 봇·메일 알림 중계, 폐쇄망용 설치 번들
      - 애플리케이션 커스텀 지표(Actuator·Micrometer)와 상태·알림·추이·원인 분석 API, 웹소켓 실시간 전송
      - React 모니터링 화면 — 서비스별 상태 카드, 추이 그래프, 알림 대응 이력·알림 끄기
    match:
      scopes: [monitoring, rules, relay, selfcheck, bundle, nginx, process, contract, alertmanager, runbook, monitor-alert]
      subject: ['모니터링', 'Prometheus', 'Actuator', 'exporter', 'Alertmanager']
      repos: [MONITORING]

  - id: embed-server
    title: 리포트 Embed 서버 분리 · 외부 임베드 연동
    points:
      - 외부 시스템용 Connection Report API — API key·Embed 토큰(JWT) 인증, 허용 IP·Origin 검증, 고객별 데이터 범위 필터
      - 리포트 캐시·Embed 세션을 공유 저장소(Redis/JDBC)로 이전, 캐시 사전 적재·만료 전 자동 갱신
      - Spark·Hadoop 의존을 뗀 조회 전용 Embed 서버로 분리(jar 445MB → 52MB)
    match:
      scopes: [embed]
      subject: ['embed', '임베드', '커넥션', 'Connection', 'screenKey', 'iframe', '외부 (호출용 )?api', '외부 시스템', '공유 저장소', '사전 적재']
      repos: [EMBED]

  - id: report-chart
    title: 리포트 · 차트 API
    points:
      - 차트 집계 확장 — COUNT_DISTINCT·FIRST, 전체 대비 비율(Quick Table Calculation), Summary Card, 계산 필드(Compute)
      - 리포트 버전 관리 — Draft 복사, 최신 데이터 자동 반영(auto_refresh), Connection 고정 버전·최신 버전 반영
    match:
      subject: ['차트', 'chart', 'Summary Card', 'Quick Table', 'QTC', 'Draft', 'compute', '리포트', 'report', 'meta_data']
      fallback_scopes: [report, ReportFeature]

  - id: pipeline
    title: 데이터 파이프라인(FLOW·Spark) 안정화 · 성능 개선
    points:
      - FLOW 실행 고착(RUNNING)·동시 실행 캐시 충돌·스케줄 중복 실행·발행 실패 등 운영 장애의 원인 추적과 수정
      - Spark 세션 자동 재생성, Spark 3.5 호환, FLOW·Spark 전용 로그 분리
      - 대용량 업로드·미리보기·엑셀 파싱·Step 처리 속도 개선, Excel 2003 XML(.xls) 반입·Oracle Export 보강
    match:
      subject: ['APF', 'Spark', 'FLOW', 'parquet', 'HDFS', '엑셀', 'Excel', 'JDBC', '\bImport\b', '\bExport\b']
      fallback_scopes: [apf, spark, cache, publish, shape, fill, join, attach, append, rank, aggregate, import, library, export, datasource, db, storage, log, project, compute, flow, socket, ddl]

  - id: cicd
    title: CI/CD · 배포 자동화
    points:
      - GitHub Actions 로 백엔드·프론트엔드·Embed·모니터링 스택 자동 배포, 기동 확인 실패 시 자동 롤백
      - 배포 키·시크릿 정리, 주기 헬스체크, 배포 결과 메신저 봇 알림
    match:
      scopes: [ci, cd, deploy, deploy-fe, fe, build, healthcheck, deploy-alert]
      types: [ci, build]
      subject: ['배포', 'CI/CD', 'workflow', '롤백', '헬스체크', 'GitHub Actions', 'deploy', '웍스 알림', 'Works alert', 'alert commit']

  - id: manual-automation
    title: 사용자 매뉴얼 자동화
    points:
      - Playwright 화면 캡처 → PPTX 매뉴얼 조립, 릴리스 tag(SemVer) 단위로 생성
      - 캡처 위 번호 표시, 메뉴 순서 목차, 지난 버전 대비 개정 이력·NEW 표시 자동화
    match:
      scopes: [manual, automation, docs-automation]
      subject: ['매뉴얼', 'manual', '캡처', 'capture', 'PPTX']

# 미분류 보고에서 뺄 커밋 — 기능이 아닌 잡일. (기능에 걸린 커밋은 type 과 무관하게 그 기능으로 센다)
ignore:
  types: [docs, chore, test, revert, style]
  subject: ['^commit$', '^커밋 내용', '^Revert ', '분석', '설정 (값 )?변경', 'server\.port', 'DS_Store', '^ddl ', 'DDL\.sql']

# 사용 기술 및 솔루션 — {java} {spring_boot} {spark} 는 첫 저장소의 build.gradle, {tag} 는 최신 릴리스 tag 에서 채운다.
# {tag} 가 든 줄은 tag 가 없으면 빠진다.
stack:
  - '언어: Java {java}, Python 3.11, TypeScript'
  - '프레임워크: Spring Boot {spring_boot}, Spring Security, MyBatis, React 18, FastAPI'
  - '데이터·인프라: PostgreSQL, Redis, Apache Spark {spark}, Hadoop(HDFS), Docker'
  - 'AI: 사내 구축 LLM(Gemma) — Ollama·llama-server(OpenAI 호환 API)'
  - '모니터링: Prometheus, Alertmanager, Micrometer·Actuator, exporter(node·postgres·blackbox·process·nginx)'
  - 'CI/자동화: GitHub Actions, Playwright, python-pptx'
  - '릴리스: {tag}'

# 프로젝트를 통해 얻은 것 — 항목마다 Notion callout 하나.
learnings:
  - title: LLM 을 제품 기능으로 만드는 방법
    body: 모델이 그럴듯한 답을 지어내지 않도록 요청 분류 → 기능별 프롬프트·스키마 → 서버 검증 순서로 단계를 나누고, 실제 모델 평가 세트로 회귀를 확인하며 기능을 넓히는 방식을 익혔습니다.
  - title: 장애를 먼저 알아채는 운영 체계
    body: 지표 수집·알림 규칙·대응 절차를 하나의 흐름으로 설계하고 감시 도구 자체의 장애까지 감시하면서, 운영 중인 서비스를 숫자로 보고 판단하는 법을 배웠습니다.
  - title: 대용량 파이프라인의 문제를 추적하는 경험
    body: Spark 기반 실행이 멈추거나 캐시가 충돌하는 문제처럼 증상과 원인이 어긋나는 이슈를 로그와 상태 전이로 추적해 재현·수정했고, 배포 자동화와 롤백으로 변경을 안전하게 내보내는 흐름을 만들었습니다.
